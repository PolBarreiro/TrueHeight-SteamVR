name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload unsigned test build
        uses: actions/upload-artifact@v7
        with:
          name: TrueHeight-unsigned-win64
          path: |
            build/Release/TrueHeight.exe
            build/Release/openvr_api.dll
            packaging/steam/default-config.ini
            LICENSE-OpenVR.txt
